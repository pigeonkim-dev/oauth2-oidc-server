# =============================================================================
# 통합 테스트 전용 설정  (@ActiveProfiles("test") 를 붙인 테스트만 이 파일을 읽는다)
#
# ★ 왜 별도 프로파일인가
#   application.yaml 의 spring.profiles.default 가 local 이라 평소엔 application-local.yml
#   (개발 DB·실 SMTP·실 키) 이 로드된다. 테스트에서 active profile 을 test 로 지정하면
#   local 은 '로드되지 않는다'. 그래서 테스트가 개발 DB 를 건드릴 수 없다.
#
# ★ 파일 이름을 application.yaml 로 두지 않은 이유
#   src/test/resources 가 클래스패스에서 먼저 잡히므로, 그 이름이면 main 의 application.yaml 을
#   통째로 가려버린다. 의도치 않은 설정까지 사라져서 원인 찾기 어려운 문제가 생긴다.
# =============================================================================

spring:
  datasource:
    # ⚠️ 개발 DB(oauth2_idp) 와 '이름이 다른' DB. 절대 같게 두지 말 것.
    url: jdbc:postgresql://localhost:5432/oauth2_idp_test
    username: user
    password: ""        # TODO: 로컬 Postgres 설정에 맞춰 채울 것 (application-local.yml 참고)
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # 운영과 동일하게 validate. 스키마는 Flyway 가 만든다.
      # ⚠️ @DataJpaTest 는 기본적으로 ddl-auto 를 create-drop 으로 바꾼다.
      #    여기서 validate 로 되돌려야 "Flyway 가 만든 스키마 = 엔티티" 를 실제로 검증한다.
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    # 테스트 DB 도 V1 부터 똑같이 쌓는다 → 운영과 같은 스키마임이 보장된다.

  # 세션은 통합 테스트에서 쓰지 않는다. 켜두면 매 테스트마다 세션 테이블을 만들려 든다.
  session:
    jdbc:
      initialize-schema: never

app:
  crypto:
    # 테스트용 더미 키. 실제 키가 아니므로 커밋해도 된다.
    # AES-256 이라 32바이트를 base64 로 인코딩한 값이어야 한다.
    # TODO: 아래 값이 32바이트인지 확인하고, 아니면 새로 만들 것
    #   생성: head -c 32 /dev/urandom | base64
    data-key: "IK9cwzP2d/14W2vS9qzVuCY5CjI8cAX5AFUE8xRVnsc="
    index-key: "9WH9iwpLk6I0EvhdAmOsUZkmtQiic0d5ocLOqDQPpQ0="

logging:
  level:
    org.flywaydb: info
    org.hibernate.SQL: debug
