<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>카카오 계정 연결</title>
    <style>
        body { max-width: 460px; margin: 40px auto; font-family: system-ui, sans-serif; }
        h3 { margin-top: 28px; }
        input { display: block; width: 100%; padding: 8px; margin: 6px 0; box-sizing: border-box; }
        button { padding: 8px 16px; cursor: pointer; }
        #msg { margin-top: 20px; font-weight: bold; }
        .hint { color: #666; font-size: 14px; }
    </style>
</head>
<body>
<h1>카카오 계정 연결</h1>
<p class="hint">카카오 로그인이 확인됐어요. 이 카카오를 <b>기존 계정</b>에 연결하려면 아래로 진행하세요.
    (증명된 카카오 신원은 서버 세션에 안전하게 보관돼 있어요.)</p>

<h3>1) 기존 계정에 인증코드 보내기</h3>
<input id="email1" placeholder="기존 이메일 (예: e2e-smoke-0804@example.com)">
<button onclick="sendCode()">코드 보내기</button>

<h3>2) 코드 입력해서 연결</h3>
<input id="email2" placeholder="기존 이메일 (위와 동일)">
<input id="code" placeholder="LINK 코드 (서버 콘솔에서 복사)">
<button onclick="linkNow()">연결</button>

<p id="msg"></p>

<script>
    // 8080 같은 출처라 세션 쿠키가 자동으로 실림 → confirm 이 세션의 PendingKakao 를 읽을 수 있음
    async function sendCode() {
        const res = await fetch('/api/link/initiate', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({existingEmail: document.getElementById('email1').value})
        });
        document.getElementById('msg').textContent =
            res.ok ? '코드 발송됨(202) — 서버 콘솔에서 LINK 코드 확인!' : ('발송 실패: ' + res.status);
    }

    async function linkNow() {
        const res = await fetch('/api/link/confirm', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                existingEmail: document.getElementById('email2').value,
                linkCode: document.getElementById('code').value
            })
        });
        const body = await res.text();
        document.getElementById('msg').textContent =
            res.ok ? '연결 성공(200)! 카카오가 기존 계정에 붙었어요.' : ('연결 실패 ' + res.status + ': ' + body);
    }
</script>
</body>
</html>
