<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>내 계정 — OAuth2 IdP</title>
    <link rel="icon" th:href="@{/favicon.svg}" type="image/svg+xml">
    <link th:href="@{/css/layout.css}" rel="stylesheet">
    <link th:href="@{/css/me.css}" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<h1>내 계정</h1>

<dl class="profile">
    <dt>이메일</dt>
    <dd th:text="${me.email}">you@example.com</dd>

    <dt>이름</dt>
    <dd th:text="${me.displayName}">홍길동</dd>

    <dt>전화번호</dt>
    <dd th:text="${me.phoneNumber} ?: '등록된 번호가 없습니다'">010-0000-0000</dd>
</dl>

<!-- 아직 만들지 않은 화면들. 지금은 자리만 잡아둔다. -->
<div class="actions">
    <button type="button" disabled>정보 수정</button>
    <button type="button" disabled>회원 탈퇴</button>
</div>

</body>
</html>
