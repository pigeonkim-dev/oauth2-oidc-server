spring:
  application:
    name: oauth2-authorization-server
  profiles:
    default: local            # 로컬 개발 기본 프로필 → application-local.yml 로드
  jpa:
    hibernate:
      # 스키마의 주인이 Flyway 로 넘어갔다. Hibernate 는 만들지도 고치지도 않고 '검사만' 한다.
      # 엔티티와 실제 테이블이 안 맞으면 기동이 실패한다 → 스키마 드리프트를 즉시 잡아준다.
      # ⚠️ update 로 되돌리지 말 것. update 는 컬럼/제약을 절대 지우지 못해서 Phase 0 이 불가능하다.
      ddl-auto: validate
    open-in-view: false       # OSIV 끔(권장)
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    # 기본값과 같지만 명시해 둔다 — 마이그레이션 파일은 여기에만 둔다.
    locations: classpath:db/migration
    # 파일명 규칙: V<버전>__<설명>.sql  (V + 숫자 + 언더바 2개 + 설명)
    # 예) V1__baseline.sql, V2__spring_session.sql
    #
    # baseline-on-migrate 는 켜지 않는다.
    # "이미 있는 DB에 Flyway 를 나중에 붙일 때" 쓰는 옵션인데,
    # 우리는 DB 를 비우고 V1 부터 새로 쌓기로 했으므로(결정 1-b) 필요 없다.
    # 켜두면 실수로 스키마가 남아 있는 DB에서 V1 을 건너뛰고도 정상으로 보여 위험하다.

  session:
    # 세션을 톰캣 메모리가 아니라 DB 에 둔다.
    # 이래야 (1) 수평 확장이 되고 (2) 강제 로그아웃 때 남의 세션을 끊을 수 있다.
    store-type: jdbc

    # 마지막 요청 이후 10분간 아무 요청이 없으면 만료 (절대시간 아님).
    # 기본 30분에서 줄였다 — IdP 성격상 짧은 쪽이 맞다.
    timeout: 10m

    jdbc:
      # ⚠️ 기본값은 embedded — H2 같은 임베디드 DB 에서만 테이블을 만든다.
      #    Postgres 는 embedded 가 아니므로 기본값이면 테이블이 안 생기고
      #    "relation SPRING_SESSION does not exist" 로 죽는다.
      # 세션 테이블은 Flyway 로 편입하지 않고 Spring Session 이 직접 관리한다(결정 b).
      # 내부적으로 CREATE TABLE IF NOT EXISTS 라 매 기동마다 돌아도 안전하다.
      # 단 운영에서는 앱 DB 계정이 DDL 권한을 계속 가져야 한다 → 배포(P5) 때 재검토.
      initialize-schema: always

logging:
  level:
    org.hibernate.SQL: debug  # 생성되는 SQL 눈으로 확인용
    org.flywaydb: info        # 어떤 마이그레이션이 적용됐는지 기동 로그로 확인